# Gas-enshrouded / dense-envelope core: 4 U x 7 n_H x 5 N_H x 2 v_turb x 3 Z = 840 per T (x 20 T = 16,800).
# Incident: agn-cloudy_T20_aox-1.40_auv-0.50. Z is absolute: 1 Z_sun = 0.015 (GalacticConcordance).
ionisation_parameter: [0.01, 0.03162277660168379, 0.1, 0.31622776601683794]   # log U -2.0 .. -0.5
hydrogen_density: [1.0e+9, 3162277660.1683793, 1.0e+10, 31622776601.683792, 1.0e+11, 316227766016.83795, 1.0e+12]
stop_column_density: [23.5, 24.0, 24.5, 25.0, 25.5]   # log10 N_H / cm^-2
turbulence: [100, 400]      # km/s
metallicities: [0.00015, 0.0015, 0.015]   # 0.01, 0.1, 1 Z_sun

# --- shared run settings (cloudy_grid_plan.txt "Run settings") ---
cloudy_version: c23.01
reference_abundance: GalacticConcordance   # Nicholls+17, Z_sun = 0.015 (author, 14 Oct 2026)
alpha_enhancement: 0.0
abundance_scalings:
  nitrogen: GalacticConcordance
  carbon: GalacticConcordance
depletion_model:            # none: no grains inside the BLR / envelope; dust comes from the LOS model
depletion_scale: 1.0
grains:
geometry: planeparallel
ionisation_parameter_model: fixed   # U fixed per grid point
T_floor: 100                # with a stop column, syncretize also writes "stop temperature off"
cosmic_rays: true
CMB:
z: 0.0
nend: 6000
iterate_to_convergence: true
resolution: 1.0
output_cont: true
output_linelist: linelist-standard.dat
