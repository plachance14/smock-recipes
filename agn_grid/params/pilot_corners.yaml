# Timing pilot corners (author, 14 Oct 2026): 2^5 = 32 per T; with the
# agn-cloudy_pilotTcorners incident grid (log T 4.0, 6.5) that is 64 runs.
ionisation_parameter: [0.01, 0.31622776601683794]   # log U -2.0, -0.5
hydrogen_density: [1.0e+8, 1.0e+12]
stop_column_density: [22.0, 26.0]
turbulence: [10, 500]
metallicities: [0.00015, 0.015]   # 0.01, 1 Z_sun

# --- shared run settings (cloudy_grid_plan.txt "Run settings") ---
cloudy_version: c23.01
reference_abundance: GalacticConcordance   # Nicholls+17, Z_sun = 0.015 (author, 14 Oct 2026)
alpha_enhancement: 0.0
abundance_scalings:
  nitrogen: GalacticConcordance
  carbon: GalacticConcordance
depletion_model:            # none: no grains inside the BLR / envelope; dust comes from the LOS model
depletion_scale: 1.0
grains:
geometry: planeparallel
ionisation_parameter_model: fixed   # U fixed per grid point
T_floor: 100                # with a stop column, syncretize also writes "stop temperature off"
cosmic_rays: true
CMB:
z: 0.0
nend: 3000
iterate_to_convergence: true
resolution: 1.0
output_cont: true
output_linelist: linelist-standard.dat
